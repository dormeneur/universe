name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: uniiverse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/uniiverse_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/uniiverse_test
      CAMPUS_EMAIL_DOMAINS: college.ac.in,*.college.ac.in
      # No mail provider in CI, so codes go to the sink the e2e suite reads.
      ALLOW_CONSOLE_MAIL: 'true'
      DEV_MAIL_SINK: /tmp/uniiverse-e2e-mail.jsonl

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The gate order is deliberate: the cheapest checks fail first, and the
      # boundary check runs before tests so an architecture violation is
      # reported as such rather than as a confusing test failure.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Architecture boundaries
        run: npm run depcruise

      - name: Format
        run: npm run format:check

      - name: Unit tests
        run: npm run test

      - name: Apply migrations
        run: npm run db:migrate

      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build

      # Installed after the cheaper gates pass, so a type error does not wait
      # on a browser download.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e
